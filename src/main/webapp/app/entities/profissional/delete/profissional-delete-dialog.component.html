@if (profissional) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(profissional.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="profissionalDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirme a exclusão</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error></jhi-alert-error>
      <p
        id="jhi-delete-profissional-heading"
        jhiTranslate="clinicaMultiTerapiasApp.profissional.delete.question"
        [translateValues]="{ id: profissional.id }"
      >
        Tem certeza de que deseja excluir Profissional {{ profissional.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
      </button>

      <button id="jhi-confirm-delete-profissional" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times"></fa-icon>&nbsp;<span jhiTranslate="entity.action.delete">Excluir</span>
      </button>
    </div>
  </form>
}
