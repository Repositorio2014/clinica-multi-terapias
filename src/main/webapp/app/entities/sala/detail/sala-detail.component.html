<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (sala(); as salaRef) {
      <div>
        <h2 data-cy="salaDetailsHeading"><span jhiTranslate="clinicaMultiTerapiasApp.sala.detail.title">Sala</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">Código</span></dt>
          <dd>
            <span>{{ salaRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="clinicaMultiTerapiasApp.sala.nome">Nome</span></dt>
          <dd>
            <span>{{ salaRef.nome }}</span>
          </dd>
          <dt><span jhiTranslate="clinicaMultiTerapiasApp.sala.descricao">Descricao</span></dt>
          <dd>
            <span>{{ salaRef.descricao }}</span>
          </dd>
          <dt><span jhiTranslate="clinicaMultiTerapiasApp.sala.capacidade">Capacidade</span></dt>
          <dd>
            <span>{{ salaRef.capacidade }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Voltar</span>
        </button>

        <button type="button" [routerLink]="['/sala', salaRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editar</span>
        </button>
      </div>
    }
  </div>
</div>
