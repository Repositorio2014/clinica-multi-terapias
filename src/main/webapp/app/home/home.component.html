<div class="row">
  <div class="col-md-12 text-center mb-4 header-multi">
    <h1>Multi - Espaço Terapêutico</h1>
    <p class="lead">Gestão de Pacientes, Agendas e Prontuários</p>
  </div>
</div>

<div class="card-grid">
  <div class="card c-pacientes">
    <div class="card-body">
      <h5><fa-icon icon="user-injured"></fa-icon> Pacientes</h5>
      <h2>{{ pacientesCount || 0 }}</h2>
      <a routerLink="/paciente">Ver lista</a>
    </div>
  </div>

  <div class="card c-agenda">
    <div class="card-body">
      <h5><fa-icon icon="calendar"></fa-icon> Agendas Hoje</h5>
      <h2>{{ agendasCount || 0 }}</h2>
      <a routerLink="/agenda">Ver agendas</a>
    </div>
  </div>

  <div class="card c-prof">
    <div class="card-body">
      <h5><fa-icon icon="user-md"></fa-icon> Profissionais</h5>
      <h2>{{ profissionaisCount || 0 }}</h2>
      <a routerLink="/profissional">Ver profissionais</a>
    </div>
  </div>

  <div class="card c-salas">
    <div class="card-body">
      <h5><fa-icon icon="door-open"></fa-icon> Salas</h5>
      <h2>{{ salasCount || 0 }}</h2>
      <a routerLink="/sala">Ver salas</a>
    </div>
  </div>
</div>
